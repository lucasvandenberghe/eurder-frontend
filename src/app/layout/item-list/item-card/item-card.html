<li class="card">
  <div class="card-title">{{ item().name }}</div>
  <img class="card-image" src="img/item-image.png" alt="item image">
  <div class="card-footer">
    <div>Price: &euro; {{ item().price.toFixed(2) }}</div>
    @if (stockIconUrl() !== undefined) {
      <div class="stock">
        <span>{{ item().stockUrgency.toLowerCase().slice('stock_'.length) }}</span>
        <img class="icon" [src]="stockIconUrl()" alt="warning">
      </div>
    }
  </div>
</li>
